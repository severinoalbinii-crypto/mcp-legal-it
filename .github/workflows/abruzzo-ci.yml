name: Abruzzo regional laws CI

on:
  pull_request:
    branches:
      - security/github-oauth-render-20261018
    paths:
      - "plugin/server/src/tools/gazzetta.py"
      - "plugin/server/src/tool_annotations.py"
      - "plugin/server/src/source_bindings.py"
      - "tests/test_abruzzo_leggi.py"
      - ".github/workflows/abruzzo-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Verify audit policy
        run: python scripts/audit_tool_annotations.py
      - name: Run Abruzzo tests
        run: pytest tests/test_abruzzo_leggi.py -q
      - name: Run all existing offline tests
        run: pytest tests/ -m "not live" -q
