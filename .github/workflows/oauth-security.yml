name: OAuth security smoke tests

on:
  pull_request:
    branches: [main]
    paths:
      - "plugin/server/src/remote_auth.py"
      - "plugin/server/src/server.py"
      - "tests/test_remote_auth.py"
      - ".github/workflows/oauth-security.yml"

permissions:
  contents: read

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Check OAuth guard and fail-closed tests
        run: pytest tests/test_remote_auth.py -q
