name: Probe official Abruzzo sources

on:
  pull_request:
    branches:
      - security/github-oauth-render-20261018
    paths:
      - "scripts/probe_abruzzo_sources.py"
      - ".github/workflows/abruzzo-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight parser
        run: pip install httpx beautifulsoup4
      - name: Probe publicly accessible official sources
        run: python scripts/probe_abruzzo_sources.py
